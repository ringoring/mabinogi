<style>
:root {
  --bg: #0e0b1a;
  --bg2: #16122a;
  --card: #1d1838;
  --card2: #241e44;
  --line: #322a5c;
  --text: #ece9ff;
  --muted: #9b94c4;
  --accent: #a87bff;
  --accent2: #ffcf6b;
  --tank: #5b8dff;
  --heal: #5fd17a;
  --dealer: #ff7b7b;
  --on: #5fd17a;
  --later: #ffcf6b;
  --off: #ff7b7b;
  --none: #6f6796;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(1200px 600px at 50% -10%, #2a2150 0%, var(--bg) 60%) fixed;
  color: var(--text);
  font-family: 'Pretendard', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  line-height: 1.5;
}
#app { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }

/* ---- Hero / 배너 ---- */
.demo-badge {
  max-width: 760px; margin: 8px auto -4px; text-align: center;
  font-size: 12px; color: var(--accent2);
  background: rgba(255,207,107,.1); border: 1px solid rgba(255,207,107,.3);
  border-radius: 999px; padding: 6px 12px;
}
.hero { text-align: center; padding: 18px 0 8px; }
.hero-guild { color: var(--accent2); font-weight: 700; letter-spacing: 2px; font-size: 13px; }
.hero h1 { margin: 4px 0 16px; font-size: 26px; }
.banner {
  width: 100%; cursor: pointer; border: none; text-align: left;
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
  background: linear-gradient(135deg, #4a2f9e, #7b4bff); color: #fff;
  border-radius: 18px; padding: 18px 22px;
  box-shadow: 0 10px 30px rgba(123,75,255,.35);
  transition: transform .12s ease, box-shadow .12s ease;
}
.banner:hover:not([disabled]) { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(123,75,255,.5); }
.banner[disabled] { opacity: .55; cursor: not-allowed; filter: grayscale(.3); }
.banner-label { grid-column: 1; font-size: 12px; opacity: .85; }
.banner-date { grid-column: 1; font-size: 24px; font-weight: 800; }
.banner-cta { grid-column: 2; grid-row: 1 / span 2; font-weight: 700; white-space: nowrap; }
.deadline { margin-top: 10px; color: var(--muted); font-size: 13px; }
.deadline b { color: var(--accent2); }

/* ---- 탭 ---- */
.tabs { display: flex; gap: 8px; margin: 18px 0 14px; }
.tab {
  flex: 1; padding: 12px; border-radius: 12px; cursor: pointer;
  background: var(--card); color: var(--muted); border: 1px solid var(--line);
  font-size: 15px; font-weight: 600;
}
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ---- 카드 ---- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 18px; margin-bottom: 14px;
}
.card h3 { margin: 0 0 12px; font-size: 17px; }
.card h3 small, .card h4 small { color: var(--muted); font-weight: 500; font-size: 13px; }
.card.muted, .muted { color: var(--muted); }
.card.error { border-color: var(--off); color: var(--off); }
.small { font-size: 12px; }

/* ---- 요약 통계 ---- */
.summary { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; text-align: center; }
.stat { background: var(--card2); border-radius: 12px; padding: 10px 4px; }
.stat b { display: block; font-size: 22px; }
.stat span { font-size: 11px; color: var(--muted); }
.stat.on b { color: var(--on); }
.stat.later b { color: var(--later); }
.stat.off b { color: var(--off); }
.stat.none b { color: var(--none); }
@media (max-width: 560px) { .summary { grid-template-columns: repeat(3, 1fr); } }

/* ---- 버튼 ---- */
.primary {
  background: var(--accent); color: #fff; border: none; border-radius: 12px;
  padding: 12px 18px; font-size: 15px; font-weight: 700; cursor: pointer;
}
.primary:hover { filter: brightness(1.08); }
.primary:disabled { opacity: .6; cursor: default; }
.primary.big { width: 100%; padding: 15px; font-size: 16px; }

/* ---- 표 ---- */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
.tbl th { color: var(--muted); font-weight: 600; font-size: 12px; }
.tbl td.num, .num { text-align: right; font-variant-numeric: tabular-nums; }
.pill { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.pill.on { background: rgba(95,209,122,.18); color: var(--on); }
.pill.off { background: rgba(255,123,123,.18); color: var(--off); }

/* ---- 클래스 뱃지 ---- */
.cls { padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
.cls.tank { background: rgba(91,141,255,.18); color: var(--tank); }
.cls.heal { background: rgba(95,209,122,.18); color: var(--heal); }
.cls.dealer { background: rgba(255,123,123,.18); color: var(--dealer); }

/* ---- 파티 ---- */
.parties { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (max-width: 560px) { .parties { grid-template-columns: 1fr; } }
.party { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.party-head { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 8px; }
.party-head .ptotal { margin-left: auto; font-size: 12px; color: var(--accent2); font-weight: 600; }
.party-head .warn { font-size: 11px; color: var(--later); background: rgba(255,207,107,.12); padding: 2px 6px; border-radius: 6px; }
.party-list { list-style: none; margin: 0; padding: 0; }
.party-list li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.party-list li:last-child { border-bottom: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.tank { background: var(--tank); } .dot.heal { background: var(--heal); } .dot.dealer { background: var(--dealer); }
.pname { font-weight: 600; }
.pw { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---- 미참석/미투표 컬럼 ---- */
.card.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.col h4 { margin: 0 0 8px; font-size: 14px; }
.col h4.off { color: var(--off); } .col h4.none { color: var(--none); }
.plain { list-style: none; margin: 0; padding: 0; }
.plain li { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.warn { color: var(--later); font-weight: 600; }

/* ---- 모달 ---- */
.modal-bg {
  position: fixed; inset: 0; background: rgba(8,5,20,.7);
  display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  backdrop-filter: blur(2px);
}
.modal {
  position: relative; width: 100%; max-width: 420px;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px;
  max-height: 90vh; overflow-y: auto;
}
.modal h2 { margin: 0 0 4px; }
.modal-x { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
.modal label { display: block; margin: 14px 0 0; font-weight: 600; font-size: 14px; }
.modal input, .modal select {
  width: 100%; margin-top: 6px; padding: 12px; font-size: 15px;
  background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; color: var(--text);
}
.class-hint { margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 20px; }
.attend-toggle { display: flex; gap: 8px; margin-top: 16px; }
.att {
  flex: 1; padding: 11px; border-radius: 10px; cursor: pointer; font-weight: 700;
  background: var(--bg2); border: 1px solid var(--line); color: var(--muted);
}
.att.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.modal .primary.big { margin-top: 18px; }
.modal-err { color: var(--off); font-size: 13px; margin-top: 10px; min-height: 16px; }

.foot { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
</style>
