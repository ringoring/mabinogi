<script>
/* ===== 표시용 설정 (화면 제목 / 파티 인원) =====
 * 기본시간·마감시간은 시트 [설정] 탭 값이 서버에서 내려옵니다. */
window.CONFIG = {
  GUILD_NAME: '리비 길드',
  CONTENT_TITLE: '월요일 정기 콘텐츠',
  PARTY_SIZE: 4
};
</script>

<script>
/* ===== party.js — 자동 파티 분배 로직 ===== */
(function (root) {
  'use strict';

  var TANK_CLASSES = ['전사', '빙결술사', '기사'];
  var HEAL_CLASSES = ['힐러', '사제', '음유시인', '수도사'];

  function categoryOf(cls) {
    if (TANK_CLASSES.indexOf(cls) !== -1) return 'tank';
    if (HEAL_CLASSES.indexOf(cls) !== -1) return 'heal';
    return 'dealer';
  }

  function byPowerDesc(a, b) {
    return (b.power || 0) - (a.power || 0);
  }

  function buildParties(members, partySize) {
    partySize = partySize || 4;

    var list = (members || []).map(function (m) {
      return {
        name: m.name,
        cls: m.cls,
        cat: categoryOf(m.cls),
        power: Number(m.power) || 0
      };
    });

    var n = list.length;
    if (n === 0) return { parties: [], waiting: [] };

    // 4명 꽉 찬 파티 우선. 딱 안 떨어지면 나머지는 대기파티로. (4명 미만이면 파티 1개)
    var numParties = Math.floor(n / partySize) || 1;
    var parties = [];
    for (var i = 0; i < numParties; i++) parties.push({ members: [], total: 0 });

    var tanks = list.filter(function (m) { return m.cat === 'tank'; }).sort(byPowerDesc);
    var heals = list.filter(function (m) { return m.cat === 'heal'; }).sort(byPowerDesc);
    var dealers = list.filter(function (m) { return m.cat === 'dealer'; }).sort(byPowerDesc);

    function add(p, m) { p.members.push(m); p.total += m.power; }
    function hasCat(p, cat) { return p.members.some(function (m) { return m.cat === cat; }); }
    function hasSupport(p) { return hasCat(p, 'tank') || hasCat(p, 'heal'); }

    // 조건 만족 + 자리 남은 파티 중 전투력 합 최저 (없으면 -1)
    function pick(ok) {
      var best = -1;
      for (var i = 0; i < numParties; i++) {
        var p = parties[i];
        if (p.members.length < partySize && ok(p)) {
          if (best === -1 || p.total < parties[best].total) best = i;
        }
      }
      return best;
    }

    var waiting = [];

    // 1) 각 파티에 탱커 1명씩 (전투력 낮은 파티 우선)
    var ti = 0;
    for (; ti < tanks.length; ti++) {
      var t = pick(function (p) { return !hasCat(p, 'tank'); });
      if (t === -1) break;
      add(parties[t], tanks[ti]);
    }

    // 2) 힐러: 지원 없는 파티 우선 → 힐 없는 파티 (둘 다 전투력 낮은 곳)
    var hi = 0;
    for (; hi < heals.length; hi++) {
      var h1 = pick(function (p) { return !hasSupport(p); });
      if (h1 === -1) break;
      add(parties[h1], heals[hi]);
    }
    for (; hi < heals.length; hi++) {
      var h2 = pick(function (p) { return !hasCat(p, 'heal'); });
      if (h2 === -1) break;
      add(parties[h2], heals[hi]);
    }

    // 3) 남은 인원 전투력 균형 그리디, 자리 없으면 대기파티
    var pool = tanks.slice(ti).concat(heals.slice(hi)).concat(dealers).sort(byPowerDesc);
    for (var k = 0; k < pool.length; k++) {
      var idx = pick(function () { return true; });
      if (idx === -1) waiting.push(pool[k]);
      else add(parties[idx], pool[k]);
    }

    waiting.sort(byPowerDesc);
    return { parties: parties, waiting: waiting };
  }

  root.Party = {
    TANK_CLASSES: TANK_CLASSES,
    HEAL_CLASSES: HEAL_CLASSES,
    categoryOf: categoryOf,
    buildParties: buildParties
  };
})(window);
</script>

<script>
/* ===== api (google.script.run 래퍼) ===== */
window.Api = {
  isDemo: function () { return false; },
  getData: function () {
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getData();
    });
  },
  submitVote: function (payload) {
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).submitVote(payload);
    });
  }
};
</script>

<script>
/* ===== app.js — UI 로직 ===== */
(function () {
  'use strict';

  var state = {
    data: null,        // Api.getData() 결과
    tab: 'vote'        // 'vote' | 'party'
  };

  var $ = function (sel, el) { return (el || document).querySelector(sel); };
  var $$ = function (sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function fmtKDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    var wd = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + wd + ')';
  }

  /* ---------- 데이터 ---------- */

  function load() {
    return Api.getData().then(function (d) {
      state.data = d;
      render();
    }).catch(function (e) {
      $('#app').innerHTML = '<div class="card error">데이터를 불러오지 못했습니다.<br><small>' +
        esc(e.message || e) + '</small></div>';
    });
  }

  /* 명단 + 투표 → 4분류 버킷 */
  function buckets() {
    var d = state.data;
    var defTime = d.defaultTime || '21:00';
    var voteByName = {};
    d.votes.forEach(function (v) { voteByName[v.name] = v; });

    var onTime = [], later = [], absent = [], noVote = [];
    d.members.forEach(function (m) {
      var v = voteByName[m.name];
      if (!v) { noVote.push(m); return; }
      var person = { name: m.name, cls: m.cls, power: Number(v.power) || 0, time: v.time };
      if (v.attend === '미참석') absent.push(person);
      else if (v.time === defTime) onTime.push(person);
      else later.push(person);
    });
    return { onTime: onTime, later: later, absent: absent, noVote: noVote };
  }

  /* ---------- 렌더 ---------- */

  function render() {
    var d = state.data;
    var openAt = new Date(d.openAt);
    var deadline = new Date(d.deadline);
    var notYetOpen = d.notYetOpen;
    var closed = d.isClosed;
    var canVote = !notYetOpen && !closed;

    var html = '';
    html += headerHTML(d, openAt, deadline, notYetOpen, closed, canVote);
    html += tabsHTML();
    html += '<div id="tab-body">' + (state.tab === 'vote' ? voteTabHTML(d, notYetOpen, closed, canVote) : partyTabHTML()) + '</div>';
    $('#app').innerHTML = html;
    bind(canVote);
    if (state.tab === 'vote') {
      if (notYetOpen) startCountdown(openAt, '접수 시작까지');   // 시작 시각 도달하면 자동 새로고침
      else if (!closed) startCountdown(deadline, '마감까지');    // 마감 시각 도달하면 자동 새로고침
    }
  }

  function headerHTML(d, openAt, deadline, notYetOpen, closed, canVote) {
    var cta = notYetOpen ? '⏳ 접수 시작 전' : (closed ? '🔒 투표 마감' : '신청하기 / 투표 ▸');
    var line = notYetOpen
      ? '접수 시작: ' + openAt.toLocaleString('ko-KR')
      : (closed ? '투표가 마감되었습니다.' : '마감: ' + deadline.toLocaleString('ko-KR'));
    return '' +
      '<header class="hero">' +
      '  <div class="hero-guild">' + esc(CONFIG.GUILD_NAME) + '</div>' +
      '  <h1>' + esc(CONFIG.CONTENT_TITLE) + '</h1>' +
      '  <button class="banner" id="banner" ' + (canVote ? '' : 'disabled') + '>' +
      '    <span class="banner-label">콘텐츠 날짜</span>' +
      '    <span class="banner-date">' + fmtKDate(d.contentDate) + '</span>' +
      '    <span class="banner-cta">' + cta + '</span>' +
      '  </button>' +
      '  <div class="deadline" id="deadline-line">' + line + '</div>' +
      '</header>';
  }

  function tabsHTML() {
    return '' +
      '<nav class="tabs">' +
      '  <button class="tab ' + (state.tab === 'vote' ? 'active' : '') + '" data-tab="vote">신청 / 투표</button>' +
      '  <button class="tab ' + (state.tab === 'party' ? 'active' : '') + '" data-tab="party">파티 분배</button>' +
      '</nav>';
  }

  /* ----- 투표 탭 ----- */

  function voteTabHTML(d, notYetOpen, closed, canVote) {
    var b = buckets();
    var total = d.members.length;
    var voted = total - b.noVote.length;

    var summary = '' +
      '<div class="card">' +
      '  <div class="summary">' +
      '    <div class="stat"><b>' + voted + '</b><span>투표</span></div>' +
      '    <div class="stat"><b>' + total + '</b><span>전체</span></div>' +
      '    <div class="stat on"><b>' + b.onTime.length + '</b><span>9시 참석</span></div>' +
      '    <div class="stat later"><b>' + b.later.length + '</b><span>9시 이후</span></div>' +
      '    <div class="stat off"><b>' + b.absent.length + '</b><span>미참석</span></div>' +
      '    <div class="stat none"><b>' + b.noVote.length + '</b><span>미투표</span></div>' +
      '  </div>' +
      '</div>';

    var cta;
    if (notYetOpen) {
      cta = '<div class="card muted">아직 접수 시작 전입니다. 매주 월요일 접수 시작 시각에 신청할 수 있습니다.</div>';
    } else if (closed) {
      cta = '<div class="card muted">투표가 마감되어 더 이상 신청할 수 없습니다. “파티 분배” 탭에서 결과를 확인하세요.</div>';
    } else {
      cta = '<div class="card"><button class="primary big" id="open-vote">＋ 내 캐릭터로 신청 / 투표</button></div>';
    }

    return summary + cta + recentVotesHTML(d);
  }

  function recentVotesHTML(d) {
    if (!d.votes.length) return '';
    var rows = d.votes.slice().sort(function (a, b) {
      return (b.updatedAt || '').localeCompare(a.updatedAt || '');
    }).map(function (v) {
      var badge = v.attend === '미참석'
        ? '<span class="pill off">미참석</span>'
        : '<span class="pill on">' + esc(v.time) + '</span>';
      return '<tr><td>' + esc(v.name) + '</td><td><span class="cls ' + Party.categoryOf(v.cls) + '">' +
        esc(v.cls) + '</span></td><td>' + badge + '</td><td class="num">' +
        (v.attend === '미참석' ? '-' : esc(String(v.power))) + '</td></tr>';
    }).join('');
    return '<div class="card"><h3>현재 투표 현황</h3>' +
      '<table class="tbl"><thead><tr><th>캐릭터</th><th>클래스</th><th>참석</th><th>전투력</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }

  /* ----- 파티 탭 ----- */

  function partyTabHTML() {
    var b = buckets();
    var html = '';

    // 9시 정시(21:00 선택자) → 파티 자동 결성
    html += '<div class="card"><h3>9시 정시 파티 <small>(' + b.onTime.length + '명)</small></h3>' +
      partiesHTML(Party.buildParties(b.onTime, CONFIG.PARTY_SIZE)) + '</div>';

    // 9시 이후 → 팀 결성 없이 리스트만 (이름/직업/전투력/시간)
    if (b.later.length) {
      html += '<div class="card"><h3>9시 이후 <small>(' + b.later.length + '명 · 팀 미결성)</small></h3>' +
        laterListHTML(b.later) + '</div>';
    }

    html += '<div class="card cols">' +
      listColHTML('미참석', b.absent, 'off') +
      listColHTML('미투표', b.noVote, 'none') +
      '</div>';

    return html;
  }

  function memberLi(m) {
    return '<li><span class="dot ' + m.cat + '"></span>' +
      '<span class="pname">' + esc(m.name) + '</span>' +
      '<span class="cls ' + m.cat + '">' + esc(m.cls) + '</span>' +
      '<span class="pw">' + esc(String(m.power)) + '</span></li>';
  }

  function partiesHTML(result) {
    var parties = (result && result.parties) || [];
    var waiting = (result && result.waiting) || [];
    if (!parties.length) return '<p class="muted">아직 인원이 없습니다.</p>';
    var html = '<div class="parties">' + parties.map(function (p, i) {
      var hasTank = p.members.some(function (m) { return m.cat === 'tank'; });
      var hasHeal = p.members.some(function (m) { return m.cat === 'heal'; });
      var warn = (!hasTank || !hasHeal)
        ? '<span class="warn">' + (!hasTank ? '탱 없음 ' : '') + (!hasHeal ? '힐 없음' : '') + '</span>'
        : '';
      return '<div class="party">' +
        '<div class="party-head">' + (i + 1) + '파티 ' + warn +
        '<span class="ptotal">전투력 ' + p.total.toLocaleString() + '</span></div>' +
        '<ul class="party-list">' + p.members.map(memberLi).join('') + '</ul></div>';
    }).join('') + '</div>';
    if (waiting.length) {
      html += '<div class="party" style="margin-top:12px;border-style:dashed;">' +
        '<div class="party-head">⏳ 대기파티 <span class="ptotal">' + waiting.length + '명</span></div>' +
        '<ul class="party-list">' + waiting.map(memberLi).join('') + '</ul></div>';
    }
    return html;
  }

  function laterListHTML(arr) {
    if (!arr.length) return '<p class="muted">없음</p>';
    var rows = arr.slice().sort(function (a, b) {
      return (a.time || '').localeCompare(b.time || '') || (b.power - a.power);
    }).map(function (m) {
      return '<tr><td>' + esc(m.name) + '</td>' +
        '<td><span class="cls ' + Party.categoryOf(m.cls) + '">' + esc(m.cls) + '</span></td>' +
        '<td class="num">' + esc(String(m.power)) + '</td>' +
        '<td><span class="pill on">' + esc(m.time) + '</span></td></tr>';
    }).join('');
    return '<table class="tbl"><thead><tr><th>캐릭터</th><th>클래스</th><th>전투력</th><th>시간</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>';
  }

  function listColHTML(title, arr, kind) {
    var items = arr.length
      ? arr.map(function (m) {
          return '<li><span class="pname">' + esc(m.name) + '</span><span class="cls ' +
            Party.categoryOf(m.cls) + '">' + esc(m.cls) + '</span></li>';
        }).join('')
      : '<li class="muted">없음</li>';
    return '<div class="col"><h4 class="' + kind + '">' + title + ' <small>(' + arr.length + ')</small></h4>' +
      '<ul class="plain">' + items + '</ul></div>';
  }

  /* ---------- 투표 모달 ---------- */

  function openModal() {
    var d = state.data;
    var opts = timeOptions(d.defaultTime);
    var memberOpts = d.members.map(function (m) {
      return '<option value="' + esc(m.name) + '">';
    }).join('');

    var modal = document.createElement('div');
    modal.className = 'modal-bg';
    modal.innerHTML = '' +
      '<div class="modal">' +
      '  <button class="modal-x" id="modal-x">✕</button>' +
      '  <h2>신청 / 투표</h2>' +
      '  <p class="muted small">' + esc(CONFIG.GUILD_NAME) + ' 길드원만 신청 가능합니다.</p>' +
      '  <label>캐릭터명' +
      '    <input id="f-name" list="members" autocomplete="off" placeholder="명단의 캐릭터명 입력">' +
      '    <datalist id="members">' + memberOpts + '</datalist>' +
      '  </label>' +
      '  <div id="f-class" class="class-hint"></div>' +
      '  <div class="attend-toggle">' +
      '    <button type="button" class="att active" data-att="참석">참석</button>' +
      '    <button type="button" class="att" data-att="미참석">미참석</button>' +
      '  </div>' +
      '  <div id="attend-fields">' +
      '    <label>참여 시간' +
      '      <select id="f-time">' + opts + '</select>' +
      '    </label>' +
      '    <label>전투력 <span class="muted small">(근사치 허용)</span>' +
      '      <input id="f-power" type="number" inputmode="numeric" min="0" placeholder="예: 35000">' +
      '    </label>' +
      '  </div>' +
      '  <div class="modal-err" id="modal-err"></div>' +
      '  <button class="primary big" id="f-submit">투표하기</button>' +
      '</div>';
    document.body.appendChild(modal);

    var attend = '참석';
    var nameEl = $('#f-name', modal);

    function refreshClass() {
      var m = d.members.filter(function (x) { return x.name === nameEl.value.trim(); })[0];
      $('#f-class', modal).innerHTML = m
        ? '<span class="cls ' + Party.categoryOf(m.cls) + '">' + esc(m.cls) + '</span> 으로 신청'
        : (nameEl.value ? '<span class="warn">명단에 없는 캐릭터입니다</span>' : '');
    }
    nameEl.addEventListener('input', refreshClass);

    $$('.att', modal).forEach(function (btn) {
      btn.addEventListener('click', function () {
        $$('.att', modal).forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        attend = btn.getAttribute('data-att');
        $('#attend-fields', modal).style.display = (attend === '참석') ? '' : 'none';
      });
    });

    function close() { document.body.removeChild(modal); }
    $('#modal-x', modal).addEventListener('click', close);
    modal.addEventListener('click', function (e) { if (e.target === modal) close(); });

    $('#f-submit', modal).addEventListener('click', function () {
      var name = nameEl.value.trim();
      var err = $('#modal-err', modal);
      err.textContent = '';
      var member = d.members.filter(function (x) { return x.name === name; })[0];
      if (!member) { err.textContent = '명단에 있는 캐릭터명을 입력해주세요.'; return; }
      var power = 0;
      if (attend === '참석') {
        power = parseInt($('#f-power', modal).value, 10);
        if (!power || power <= 0) { err.textContent = '전투력을 입력해주세요.'; return; }
      }
      var payload = {
        name: name,
        attend: attend,
        time: attend === '참석' ? $('#f-time', modal).value : '',
        power: power
      };
      var sub = $('#f-submit', modal);
      sub.disabled = true; sub.textContent = '전송 중...';
      Api.submitVote(payload).then(function (res) {
        if (res && res.ok) { close(); load(); }
        else { err.textContent = (res && res.error) || '저장에 실패했습니다.'; sub.disabled = false; sub.textContent = '투표하기'; }
      }).catch(function (e) {
        err.textContent = '오류: ' + (e.message || e); sub.disabled = false; sub.textContent = '투표하기';
      });
    });
  }

  function timeOptions(def) {
    var times = [];
    for (var h = 21; h <= 23; h++) {
      times.push(('0' + h).slice(-2) + ':00');
      times.push(('0' + h).slice(-2) + ':30');
    }
    return times.map(function (t) {
      var label = (t === def) ? t + ' (정시)' : t;
      return '<option value="' + t + '"' + (t === def ? ' selected' : '') + '>' + label + '</option>';
    }).join('');
  }

  /* ---------- 카운트다운 ---------- */

  var countdownTimer = null;
  function startCountdown(target, label) {
    if (countdownTimer) clearInterval(countdownTimer);
    function tick() {
      var line = $('#deadline-line');
      if (!line) { clearInterval(countdownTimer); return; }
      var ms = target - new Date();
      if (ms <= 0) { clearInterval(countdownTimer); load(); return; }  // 시작/마감 시각 도달 → 상태 갱신
      var h = Math.floor(ms / 3600000);
      var m = Math.floor((ms % 3600000) / 60000);
      var s = Math.floor((ms % 60000) / 1000);
      line.innerHTML = label + ' <b>' + h + '시간 ' + m + '분 ' + s + '초</b> · ' + target.toLocaleString('ko-KR');
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  /* ---------- 이벤트 바인딩 ---------- */

  function bind(canVote) {
    $$('.tab').forEach(function (t) {
      t.addEventListener('click', function () {
        state.tab = t.getAttribute('data-tab');
        render();
      });
    });
    if (canVote) {
      var banner = $('#banner');
      if (banner) banner.addEventListener('click', openModal);
      var ov = $('#open-vote');
      if (ov) ov.addEventListener('click', openModal);
    }
  }

  /* ---------- 시작 ---------- */
  load();
})();
</script>
