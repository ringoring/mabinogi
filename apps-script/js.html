<script>
/* ===== 표시용 설정 (화면 제목 / 파티 인원) =====
 * 기본시간·마감시간은 시트 [설정] 탭 값이 서버에서 내려옵니다. */
window.CONFIG = {
  GUILD_NAME: '리비 길드',
  CONTENT_TITLE: '월요일 정기 콘텐츠',
  PARTY_SIZE: 4
};
</script>

<script>
/* ===== party.js — 자동 파티 분배 로직 ===== */
(function (root) {
  'use strict';

  var TANK_CLASSES = ['전사', '빙결술사', '기사'];
  var HEAL_CLASSES = ['힐러', '사제', '음유시인', '수도사'];

  function categoryOf(cls) {
    if (TANK_CLASSES.indexOf(cls) !== -1) return 'tank';
    if (HEAL_CLASSES.indexOf(cls) !== -1) return 'heal';
    return 'dealer';
  }

  function byPowerDesc(a, b) {
    return (b.power || 0) - (a.power || 0);
  }

  function buildParties(members, partySize) {
    partySize = partySize || 4;

    var list = (members || []).map(function (m) {
      return {
        name: m.name,
        cls: m.cls,
        cat: categoryOf(m.cls),
        power: Number(m.power) || 0
      };
    });

    var n = list.length;
    if (n === 0) return { parties: [], waiting: [] };

    // 4명 꽉 찬 파티 우선. 딱 안 떨어지면 나머지는 대기파티로. (4명 미만이면 파티 1개)
    var numParties = Math.floor(n / partySize) || 1;
    var parties = [];
    for (var i = 0; i < numParties; i++) parties.push({ members: [], total: 0 });

    var tanks = list.filter(function (m) { return m.cat === 'tank'; }).sort(byPowerDesc);
    var heals = list.filter(function (m) { return m.cat === 'heal'; }).sort(byPowerDesc);
    var dealers = list.filter(function (m) { return m.cat === 'dealer'; }).sort(byPowerDesc);

    function add(p, m) { p.members.push(m); p.total += m.power; }
    function hasCat(p, cat) { return p.members.some(function (m) { return m.cat === cat; }); }
    function hasSupport(p) { return hasCat(p, 'tank') || hasCat(p, 'heal'); }

    // 조건 만족 + 자리 남은 파티 중 전투력 합 최저 (없으면 -1)
    function pick(ok) {
      var best = -1;
      for (var i = 0; i < numParties; i++) {
        var p = parties[i];
        if (p.members.length < partySize && ok(p)) {
          if (best === -1 || p.total < parties[best].total) best = i;
        }
      }
      return best;
    }

    var waiting = [];

    // 1) 각 파티에 탱커 1명씩 (전투력 낮은 파티 우선)
    var ti = 0;
    for (; ti < tanks.length; ti++) {
      var t = pick(function (p) { return !hasCat(p, 'tank'); });
      if (t === -1) break;
      add(parties[t], tanks[ti]);
    }

    // 2) 힐러: 지원 없는 파티 우선 → 힐 없는 파티 (둘 다 전투력 낮은 곳)
    var hi = 0;
    for (; hi < heals.length; hi++) {
      var h1 = pick(function (p) { return !hasSupport(p); });
      if (h1 === -1) break;
      add(parties[h1], heals[hi]);
    }
    for (; hi < heals.length; hi++) {
      var h2 = pick(function (p) { return !hasCat(p, 'heal'); });
      if (h2 === -1) break;
      add(parties[h2], heals[hi]);
    }

    // 3) 남은 인원 전투력 균형 그리디, 자리 없으면 대기파티
    var pool = tanks.slice(ti).concat(heals.slice(hi)).concat(dealers).sort(byPowerDesc);
    for (var k = 0; k < pool.length; k++) {
      var idx = pick(function () { return true; });
      if (idx === -1) waiting.push(pool[k]);
      else add(parties[idx], pool[k]);
    }

    waiting.sort(byPowerDesc);
    return { parties: parties, waiting: waiting };
  }

  root.Party = {
    TANK_CLASSES: TANK_CLASSES,
    HEAL_CLASSES: HEAL_CLASSES,
    categoryOf: categoryOf,
    buildParties: buildParties
  };
})(window);
</script>

<script>
/* ===== api (google.script.run 래퍼) ===== */
window.Api = {
  isDemo: function () { return false; },
  getData: function () {
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getData();
    });
  },
  submitVote: function (payload) {
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).submitVote(payload);
    });
  }
};

<script>
/* ===== app.js — UI 로직 ===== */
(function () {
  'use strict';

  var state = {
    data: null,        // Api.getData() 결과
    tab: 'vote',       // 'vote' | 'party'
    admin: false,      // 관리자 인증 여부
    adminKey: null,    // 관리자 비번 (저장 호출용)
    editing: false,    // 관리자 편성 편집 중
    draft: null,       // 편집 작업본 {parties:[[name]], waiting:[name]}
    frozeTried: false  // 자동 동결 중복 호출 방지
  };

  var $ = function (sel, el) { return (el || document).querySelector(sel); };
  var $$ = function (sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function fmtKDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    var wd = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + wd + ')';
  }

  /* ---------- 데이터 ---------- */

  function load() {
    return Api.getData().then(function (d) {
      state.data = d;
      render();
    }).catch(function (e) {
      $('#app').innerHTML = '<div class="card error">데이터를 불러오지 못했습니다.<br><small>' +
        esc(e.message || e) + '</small></div>';
    });
  }

  /* 명단 + 투표 → 4분류 버킷 */
  function buckets() {
    var d = state.data;
    var defTime = d.defaultTime || '21:00';
    var voteByName = {};
    d.votes.forEach(function (v) { voteByName[v.name] = v; });

    var onTime = [], later = [], absent = [], noVote = [];
    d.members.forEach(function (m) {
      var v = voteByName[m.name];
      if (!v) { noVote.push(m); return; }
      var person = { name: m.name, cls: m.cls, power: Number(v.power) || 0, time: v.time };
      if (v.attend === '미참석') absent.push(person);
      else if (v.time === defTime) onTime.push(person);
      else later.push(person);
    });
    return { onTime: onTime, later: later, absent: absent, noVote: noVote };
  }

  /* ---------- 렌더 ---------- */

  function render() {
    var d = state.data;
    var openAt = new Date(d.openAt);
    var deadline = new Date(d.deadline);
    var notYetOpen = d.notYetOpen;
    var closed = d.isClosed;
    var canVote = !notYetOpen;   // 마감 후에도 투표는 가능. 접수 시작 전만 막음

    var html = '';
    html += headerHTML(d, openAt, deadline, notYetOpen, closed, canVote);
    html += tabsHTML();
    html += '<div id="tab-body">' + (state.tab === 'vote' ? voteTabHTML(d, notYetOpen, closed, canVote) : partyTabHTML()) + '</div>';
    $('#app').innerHTML = html;
    bind(canVote);
    if (state.tab === 'vote') {
      if (notYetOpen) startCountdown(openAt, '접수 시작까지');   // 시작 시각 도달하면 자동 새로고침
      else if (!closed) startCountdown(deadline, '마감까지');    // 마감 시각 도달하면 자동 새로고침
    }
  }

  function headerHTML(d, openAt, deadline, notYetOpen, closed, canVote) {
    var cta = notYetOpen ? '⏳ 접수 시작 전' : '신청하기 / 투표 ▸';
    var line = notYetOpen
      ? '접수 시작: ' + openAt.toLocaleString('ko-KR')
      : (closed ? '🔒 마감됨 · 추가 신청 가능 (팀 편성 고정)' : '마감: ' + deadline.toLocaleString('ko-KR'));
    return '' +
      '<header class="hero">' +
      '  <div class="hero-guild">' + esc(CONFIG.GUILD_NAME) + '</div>' +
      '  <h1>' + esc(CONFIG.CONTENT_TITLE) + '</h1>' +
      '  <button class="banner" id="banner" ' + (canVote ? '' : 'disabled') + '>' +
      '    <span class="banner-label">콘텐츠 날짜</span>' +
      '    <span class="banner-date">' + fmtKDate(d.contentDate) + '</span>' +
      '    <span class="banner-cta">' + cta + '</span>' +
      '  </button>' +
      '  <div class="deadline" id="deadline-line">' + line + '</div>' +
      '</header>';
  }

  function tabsHTML() {
    return '' +
      '<nav class="tabs">' +
      '  <button class="tab ' + (state.tab === 'vote' ? 'active' : '') + '" data-tab="vote">신청 / 투표</button>' +
      '  <button class="tab ' + (state.tab === 'party' ? 'active' : '') + '" data-tab="party">파티 분배</button>' +
      '</nav>';
  }

  /* ----- 투표 탭 ----- */

  function voteTabHTML(d, notYetOpen, closed, canVote) {
    var b = buckets();
    var total = d.members.length;
    var voted = total - b.noVote.length;

    var summary = '' +
      '<div class="card">' +
      '  <div class="summary">' +
      '    <div class="stat"><b>' + voted + '</b><span>투표</span></div>' +
      '    <div class="stat"><b>' + total + '</b><span>전체</span></div>' +
      '    <div class="stat on"><b>' + b.onTime.length + '</b><span>9시 참석</span></div>' +
      '    <div class="stat later"><b>' + b.later.length + '</b><span>9시 이후</span></div>' +
      '    <div class="stat off"><b>' + b.absent.length + '</b><span>미참석</span></div>' +
      '    <div class="stat none"><b>' + b.noVote.length + '</b><span>미투표</span></div>' +
      '  </div>' +
      '</div>';

    var cta;
    if (notYetOpen) {
      cta = '<div class="card muted">아직 접수 시작 전입니다. 매주 월요일 접수 시작 시각에 신청할 수 있습니다.</div>';
    } else if (closed) {
      cta = '<div class="card"><p class="muted small" style="margin:0 0 10px;">마감 후 추가 신청입니다. 자동 팀 편성에는 반영되지 않으며, 관리자가 수동으로 배치합니다.</p>' +
        '<button class="primary big" id="open-vote">＋ 내 캐릭터로 신청 / 투표</button></div>';
    } else {
      cta = '<div class="card"><button class="primary big" id="open-vote">＋ 내 캐릭터로 신청 / 투표</button></div>';
    }

    return summary + cta + recentVotesHTML(d);
  }

  function recentVotesHTML(d) {
    if (!d.votes.length) return '';
    var rows = d.votes.slice().sort(function (a, b) {
      return (b.updatedAt || '').localeCompare(a.updatedAt || '');
    }).map(function (v) {
      var badge = v.attend === '미참석'
        ? '<span class="pill off">미참석</span>'
        : '<span class="pill on">' + esc(v.time) + '</span>';
      return '<tr><td>' + esc(v.name) + '</td><td><span class="cls ' + Party.categoryOf(v.cls) + '">' +
        esc(v.cls) + '</span></td><td>' + badge + '</td><td class="num">' +
        (v.attend === '미참석' ? '-' : esc(String(v.power))) + '</td></tr>';
    }).join('');
    return '<div class="card"><h3>현재 투표 현황</h3>' +
      '<table class="tbl"><thead><tr><th>캐릭터</th><th>클래스</th><th>참석</th><th>전투력</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }

  /* ----- 파티 탭 ----- */

  function partyTabHTML() {
    var b = buckets();
    var html = '';

    // 9시 정시(21:00 선택자) → 파티 편성 (저장본 우선 / 마감 후 동결 / 관리자 편집)
    html += '<div class="card">' + onTimeSectionHTML(b) + '</div>';

    // 9시 이후 → 팀 결성 없이 리스트만 (이름/직업/전투력/시간)
    if (b.later.length) {
      html += '<div class="card"><h3>9시 이후 <small>(' + b.later.length + '명 · 팀 미결성)</small></h3>' +
        laterListHTML(b.later) + '</div>';
    }

    html += '<div class="card cols">' +
      listColHTML('미참석', b.absent, 'off') +
      listColHTML('미투표', b.noVote, 'none') +
      '</div>';

    return html;
  }

  /* ----- 9시 정시 편성 ----- */

  // 이름 → 표시용 인물 객체 (클래스/전투력/시간 보강)
  function personOf(name) {
    var d = state.data;
    if (personOf._for !== d) {
      var mm = {}; d.members.forEach(function (m) { mm[m.name] = m; });
      var vv = {}; d.votes.forEach(function (v) { vv[v.name] = v; });
      personOf._m = mm; personOf._v = vv; personOf._for = d;
    }
    var m = personOf._m[name], v = personOf._v[name];
    var cls = m ? m.cls : '';
    return {
      name: name, cls: cls, cat: Party.categoryOf(cls),
      power: v ? (Number(v.power) || 0) : 0,
      time: v ? v.time : ''
    };
  }

  // buildParties 결과 → 이름 배열 편성
  function toAssignment(result) {
    return {
      parties: (result.parties || []).map(function (p) { return p.members.map(function (m) { return m.name; }); }),
      waiting: (result.waiting || []).map(function (m) { return m.name; })
    };
  }

  // 화면에 표시할 편성 결정 (편집중>저장본>마감동결>실시간)
  function currentAssignment(b) {
    var d = state.data;
    if (state.editing && state.draft) return state.draft;
    if (d.assignment) return d.assignment;
    var built = toAssignment(Party.buildParties(b.onTime, CONFIG.PARTY_SIZE));
    if (d.isClosed && !state.frozeTried) {   // 마감인데 저장본 없으면 1회 동결
      state.frozeTried = true;
      google.script.run
        .withSuccessHandler(function () { load(); })
        .withFailureHandler(function () {})
        .freezeAssignment(d.contentDate, built);
    }
    return built;
  }

  function onTimeSectionHTML(b) {
    var d = state.data;
    var assign = currentAssignment(b);

    var tag;
    if (state.editing) tag = '<span class="warn">편집 중</span>';
    else if (d.assignment) tag = '<span class="pill on">편성 확정</span>';
    else if (d.isClosed) tag = '<span class="pill on">편성 고정</span>';
    else tag = '<span class="muted small">실시간 미리보기</span>';

    var html = '<h3>9시 정시 파티 <small>(' + b.onTime.length + '명)</small> ' + tag + '</h3>';
    html += assignmentHTML(assign);
    if (!state.editing) html += unassignedHTML(b, assign);
    html += adminBarHTML();
    return html;
  }

  function assignLi(m, from, numParties) {
    var base = '<span class="dot ' + m.cat + '"></span>' +
      '<span class="pname">' + esc(m.name) + '</span>' +
      '<span class="cls ' + m.cat + '">' + esc(m.cls) + '</span>' +
      '<span class="pw">' + esc(String(m.power)) + '</span>';
    if (!state.editing) return '<li>' + base + '</li>';
    var opts = '';
    for (var i = 0; i < numParties; i++) {
      opts += '<option value="p' + i + '"' + (from === 'p' + i ? ' selected' : '') + '>' + (i + 1) + '파티</option>';
    }
    opts += '<option value="wait"' + (from === 'wait' ? ' selected' : '') + '>대기</option>';
    return '<li>' + base +
      '<select class="move" data-name="' + esc(m.name) + '" data-from="' + from + '" ' +
      'style="margin-left:8px;padding:4px;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:6px;">' +
      opts + '</select></li>';
  }

  function assignmentHTML(assign) {
    var parties = assign.parties || [];
    var waiting = assign.waiting || [];
    if (!parties.length && !waiting.length) return '<p class="muted">아직 인원이 없습니다.</p>';
    var numParties = parties.length;

    var html = '<div class="parties">' + parties.map(function (names, i) {
      var members = names.map(personOf);
      var total = members.reduce(function (a, m) { return a + m.power; }, 0);
      var hasTank = members.some(function (m) { return m.cat === 'tank'; });
      var hasHeal = members.some(function (m) { return m.cat === 'heal'; });
      var warn = (!hasTank || !hasHeal)
        ? '<span class="warn">' + (!hasTank ? '탱 없음 ' : '') + (!hasHeal ? '힐 없음' : '') + '</span>' : '';
      var lis = members.map(function (m) { return assignLi(m, 'p' + i, numParties); }).join('');
      return '<div class="party"><div class="party-head">' + (i + 1) + '파티 ' + warn +
        '<span class="ptotal">전투력 ' + total.toLocaleString() + '</span></div>' +
        '<ul class="party-list">' + lis + '</ul></div>';
    }).join('') + '</div>';

    var wmembers = waiting.map(personOf);
    if (wmembers.length || state.editing) {
      var wlis = wmembers.map(function (m) { return assignLi(m, 'wait', numParties); }).join('') ||
        '<li class="muted">없음</li>';
      html += '<div class="party" style="margin-top:12px;border-style:dashed;">' +
        '<div class="party-head">⏳ 대기파티 <span class="ptotal">' + wmembers.length + '명</span></div>' +
        '<ul class="party-list">' + wlis + '</ul></div>';
    }
    return html;
  }

  // 9시 정시 신청자 중 편성에 없는 사람(마감 후 추가 신청 등)
  function unassignedHTML(b, assign) {
    var inAssign = {};
    (assign.parties || []).forEach(function (names) { names.forEach(function (n) { inAssign[n] = 1; }); });
    (assign.waiting || []).forEach(function (n) { inAssign[n] = 1; });
    var extras = b.onTime.filter(function (p) { return !inAssign[p.name]; });
    if (!extras.length) return '';
    var lis = extras.map(function (p) {
      var m = { name: p.name, cls: p.cls, cat: Party.categoryOf(p.cls), power: Number(p.power) || 0 };
      return '<li><span class="dot ' + m.cat + '"></span><span class="pname">' + esc(m.name) +
        '</span><span class="cls ' + m.cat + '">' + esc(m.cls) + '</span><span class="pw">' +
        esc(String(m.power)) + '</span></li>';
    }).join('');
    return '<div style="margin-top:12px;">' +
      '<h4 style="color:var(--accent2);margin:0 0 8px;">추가 신청 · 미배정 <small>(' + extras.length + ')</small></h4>' +
      '<ul class="party-list">' + lis + '</ul>' +
      (state.admin ? '<p class="muted small" style="margin-top:6px;">“수동 편성”에서 배치할 수 있습니다.</p>' : '') +
      '</div>';
  }

  function adminBarHTML() {
    var d = state.data;
    if (!d.adminEnabled) return '';
    if (!state.admin) {
      return '<div style="margin-top:14px;text-align:right;">' +
        '<button class="tab" id="admin-login" style="flex:none;padding:8px 14px;">🔧 관리자</button></div>';
    }
    if (state.editing) {
      return '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;">' +
        '<button class="tab" id="admin-cancel" style="flex:none;padding:8px 14px;">취소</button>' +
        '<button class="primary" id="admin-save" style="padding:8px 16px;">💾 편성 저장</button></div>';
    }
    return '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;">' +
      '<button class="tab" id="admin-reset" style="flex:none;padding:8px 14px;">↩️ 초기화</button>' +
      '<button class="tab" id="admin-auto" style="flex:none;padding:8px 14px;">🔄 자동 재편성</button>' +
      '<button class="primary" id="admin-edit" style="padding:8px 16px;">✏️ 수동 편성</button></div>';
  }

  function laterListHTML(arr) {
    if (!arr.length) return '<p class="muted">없음</p>';
    var rows = arr.slice().sort(function (a, b) {
      return (a.time || '').localeCompare(b.time || '') || (b.power - a.power);
    }).map(function (m) {
      return '<tr><td>' + esc(m.name) + '</td>' +
        '<td><span class="cls ' + Party.categoryOf(m.cls) + '">' + esc(m.cls) + '</span></td>' +
        '<td class="num">' + esc(String(m.power)) + '</td>' +
        '<td><span class="pill on">' + esc(m.time) + '</span></td></tr>';
    }).join('');
    return '<table class="tbl"><thead><tr><th>캐릭터</th><th>클래스</th><th>전투력</th><th>시간</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>';
  }

  function listColHTML(title, arr, kind) {
    var items = arr.length
      ? arr.map(function (m) {
          return '<li><span class="pname">' + esc(m.name) + '</span><span class="cls ' +
            Party.categoryOf(m.cls) + '">' + esc(m.cls) + '</span></li>';
        }).join('')
      : '<li class="muted">없음</li>';
    return '<div class="col"><h4 class="' + kind + '">' + title + ' <small>(' + arr.length + ')</small></h4>' +
      '<ul class="plain">' + items + '</ul></div>';
  }

  /* ---------- 투표 모달 ---------- */

  function openModal() {
    var d = state.data;
    var opts = timeOptions(d.defaultTime);
    var memberOpts = d.members.map(function (m) {
      return '<option value="' + esc(m.name) + '">';
    }).join('');

    var modal = document.createElement('div');
    modal.className = 'modal-bg';
    modal.innerHTML = '' +
      '<div class="modal">' +
      '  <button class="modal-x" id="modal-x">✕</button>' +
      '  <h2>신청 / 투표</h2>' +
      '  <p class="muted small">' + esc(CONFIG.GUILD_NAME) + ' 길드원만 신청 가능합니다.</p>' +
      '  <label>캐릭터명' +
      '    <input id="f-name" list="members" autocomplete="off" placeholder="명단의 캐릭터명 입력">' +
      '    <datalist id="members">' + memberOpts + '</datalist>' +
      '  </label>' +
      '  <div id="f-class" class="class-hint"></div>' +
      '  <div class="attend-toggle">' +
      '    <button type="button" class="att active" data-att="참석">참석</button>' +
      '    <button type="button" class="att" data-att="미참석">미참석</button>' +
      '  </div>' +
      '  <div id="attend-fields">' +
      '    <label>참여 시간' +
      '      <select id="f-time">' + opts + '</select>' +
      '    </label>' +
      '    <label>전투력 <span class="muted small">(근사치 허용)</span>' +
      '      <input id="f-power" type="number" inputmode="numeric" min="0" placeholder="예: 35000">' +
      '    </label>' +
      '  </div>' +
      '  <div class="modal-err" id="modal-err"></div>' +
      '  <button class="primary big" id="f-submit">투표하기</button>' +
      '</div>';
    document.body.appendChild(modal);

    var attend = '참석';
    var nameEl = $('#f-name', modal);

    function refreshClass() {
      var m = d.members.filter(function (x) { return x.name === nameEl.value.trim(); })[0];
      $('#f-class', modal).innerHTML = m
        ? '<span class="cls ' + Party.categoryOf(m.cls) + '">' + esc(m.cls) + '</span> 으로 신청'
        : (nameEl.value ? '<span class="warn">명단에 없는 캐릭터입니다</span>' : '');
    }
    nameEl.addEventListener('input', refreshClass);

    $$('.att', modal).forEach(function (btn) {
      btn.addEventListener('click', function () {
        $$('.att', modal).forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        attend = btn.getAttribute('data-att');
        $('#attend-fields', modal).style.display = (attend === '참석') ? '' : 'none';
      });
    });

    function close() { document.body.removeChild(modal); }
    $('#modal-x', modal).addEventListener('click', close);
    modal.addEventListener('click', function (e) { if (e.target === modal) close(); });

    $('#f-submit', modal).addEventListener('click', function () {
      var name = nameEl.value.trim();
      var err = $('#modal-err', modal);
      err.textContent = '';
      var member = d.members.filter(function (x) { return x.name === name; })[0];
      if (!member) { err.textContent = '명단에 있는 캐릭터명을 입력해주세요.'; return; }
      var power = 0;
      if (attend === '참석') {
        power = parseInt($('#f-power', modal).value, 10);
        if (!power || power <= 0) { err.textContent = '전투력을 입력해주세요.'; return; }
      }
      var payload = {
        name: name,
        attend: attend,
        time: attend === '참석' ? $('#f-time', modal).value : '',
        power: power
      };
      var sub = $('#f-submit', modal);
      sub.disabled = true; sub.textContent = '전송 중...';
      Api.submitVote(payload).then(function (res) {
        if (res && res.ok) { close(); load(); }
        else { err.textContent = (res && res.error) || '저장에 실패했습니다.'; sub.disabled = false; sub.textContent = '투표하기'; }
      }).catch(function (e) {
        err.textContent = '오류: ' + (e.message || e); sub.disabled = false; sub.textContent = '투표하기';
      });
    });
  }

  function timeOptions(def) {
    var times = [];
    for (var h = 21; h <= 23; h++) {
      times.push(('0' + h).slice(-2) + ':00');
      times.push(('0' + h).slice(-2) + ':30');
    }
    return times.map(function (t) {
      var label = (t === def) ? t + ' (정시)' : t;
      return '<option value="' + t + '"' + (t === def ? ' selected' : '') + '>' + label + '</option>';
    }).join('');
  }

  /* ---------- 카운트다운 ---------- */

  var countdownTimer = null;
  function startCountdown(target, label) {
    if (countdownTimer) clearInterval(countdownTimer);
    function tick() {
      var line = $('#deadline-line');
      if (!line) { clearInterval(countdownTimer); return; }
      var ms = target - new Date();
      if (ms <= 0) { clearInterval(countdownTimer); load(); return; }  // 시작/마감 시각 도달 → 상태 갱신
      var h = Math.floor(ms / 3600000);
      var m = Math.floor((ms % 3600000) / 60000);
      var s = Math.floor((ms % 60000) / 1000);
      line.innerHTML = label + ' <b>' + h + '시간 ' + m + '분 ' + s + '초</b> · ' + target.toLocaleString('ko-KR');
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  /* ---------- 이벤트 바인딩 ---------- */

  function bind(canVote) {
    $$('.tab').forEach(function (t) {
      if (!t.getAttribute('data-tab')) return;   // 관리자 버튼(.tab)은 제외
      t.addEventListener('click', function () {
        state.tab = t.getAttribute('data-tab');
        render();
      });
    });
    if (canVote) {
      var banner = $('#banner');
      if (banner) banner.addEventListener('click', openModal);
      var ov = $('#open-vote');
      if (ov) ov.addEventListener('click', openModal);
    }
    // 관리자 버튼들
    var al = $('#admin-login'); if (al) al.addEventListener('click', adminLogin);
    var ae = $('#admin-edit');  if (ae) ae.addEventListener('click', startEditing);
    var aa = $('#admin-auto');  if (aa) aa.addEventListener('click', adminAuto);
    var ar = $('#admin-reset'); if (ar) ar.addEventListener('click', adminReset);
    var ac = $('#admin-cancel'); if (ac) ac.addEventListener('click', function () { state.editing = false; state.draft = null; render(); });
    var as = $('#admin-save');  if (as) as.addEventListener('click', adminSave);
    $$('.move').forEach(function (sel) {
      sel.addEventListener('change', function () {
        moveMember(sel.getAttribute('data-name'), sel.getAttribute('data-from'), sel.value);
      });
    });
  }

  /* ---------- 관리자 ---------- */

  function adminLogin() {
    var key = window.prompt('관리자 비밀번호를 입력하세요');
    if (key == null) return;
    google.script.run.withSuccessHandler(function (ok) {
      if (ok) { state.admin = true; state.adminKey = key; render(); }
      else window.alert('비밀번호가 올바르지 않습니다.');
    }).withFailureHandler(function (e) { window.alert('오류: ' + (e.message || e)); }).verifyAdmin(key);
  }

  function startEditing() {
    var b = buckets();
    var cur = currentAssignment(b);
    var draft = {
      parties: (cur.parties || []).map(function (a) { return a.slice(); }),
      waiting: (cur.waiting || []).slice()
    };
    var inAssign = {};
    draft.parties.forEach(function (names) { names.forEach(function (n) { inAssign[n] = 1; }); });
    draft.waiting.forEach(function (n) { inAssign[n] = 1; });
    b.onTime.forEach(function (p) { if (!inAssign[p.name]) draft.waiting.push(p.name); });
    state.draft = draft;
    state.editing = true;
    render();
  }

  function moveMember(name, from, to) {
    if (!state.draft) return;
    function rm(arr) { if (!arr) return; var i = arr.indexOf(name); if (i !== -1) arr.splice(i, 1); }
    if (from === 'wait') rm(state.draft.waiting);
    else if (from.charAt(0) === 'p') rm(state.draft.parties[parseInt(from.slice(1), 10)]);
    else { state.draft.parties.forEach(rm); rm(state.draft.waiting); }
    if (to === 'wait') state.draft.waiting.push(name);
    else if (to.charAt(0) === 'p') {
      var idx = parseInt(to.slice(1), 10);
      if (!state.draft.parties[idx]) state.draft.parties[idx] = [];
      state.draft.parties[idx].push(name);
    }
    render();
  }

  function adminAuto() {
    if (!window.confirm('현재 9시 정시 신청자로 팀을 자동 재편성하고 저장할까요?')) return;
    var b = buckets();
    saveAssignment(toAssignment(Party.buildParties(b.onTime, CONFIG.PARTY_SIZE)));
  }

  function adminReset() {
    if (!window.confirm('저장된 편성을 삭제하고 자동/실시간 편성으로 되돌릴까요?')) return;
    google.script.run.withSuccessHandler(function (res) {
      if (res && res.ok) { state.frozeTried = false; load(); }
      else window.alert((res && res.error) || '실패');
    }).withFailureHandler(function (e) { window.alert('오류: ' + (e.message || e)); })
      .adminResetAssignment(state.data.contentDate, state.adminKey);
  }

  function adminSave() {
    if (state.draft) saveAssignment(state.draft);
  }

  function saveAssignment(assignment) {
    google.script.run.withSuccessHandler(function (res) {
      if (res && res.ok) { state.editing = false; state.draft = null; load(); }
      else window.alert((res && res.error) || '저장 실패');
    }).withFailureHandler(function (e) { window.alert('오류: ' + (e.message || e)); })
      .adminSaveAssignment(state.data.contentDate, assignment, state.adminKey);
  }

  /* ---------- 시작 ---------- */
  load();
})();
</script>
